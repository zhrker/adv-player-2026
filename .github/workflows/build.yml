name: Build SMB Player APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Patch SDK versions
        run: |
          sed -i "s/version '8.6.1'/version '8.9.1'/" build.gradle
          sed -i "s/compileSdk 35/compileSdk 36/" app/build.gradle
          echo "=== build.gradle ==="
          head -4 build.gradle
          echo "=== app/build.gradle ==="
          grep -E "compileSdk|targetSdk" app/build.gradle

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smb-player-v2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
